---
deployment:
  tasks:
    - /usr/bin/rsync -av --checksum --no-perms --omit-dir-times --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='README.md' --exclude='CICD.md' --exclude='CLAUDE.md' --exclude='includes/config.php' ./ $HOME/kdist.in/apps/ > $HOME/last-kd-deploy.log 2>&1
    - /bin/chmod 755 $HOME/kdist.in $HOME/kdist.in/apps
    - /usr/bin/find $HOME/kdist.in/apps -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find $HOME/kdist.in/apps -type f -exec /bin/chmod 644 {} +
    - /usr/bin/find $HOME/kdist.in/apps -name '*.php' -exec /usr/bin/touch {} +
    - /bin/rm -f $HOME/kdist.in/apps/CLAUDE.md
