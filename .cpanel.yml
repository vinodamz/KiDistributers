---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/kdist.in/apps
    - /usr/bin/rsync -av --checksum --no-perms --omit-dir-times --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='README.md' --exclude='CICD.md' --exclude='CLAUDE.md' --exclude='includes/config.php' ./ $DEPLOYPATH/ > $HOME/last-kd-deploy.log 2>&1
    - /bin/chmod 755 $HOME/kdist.in $DEPLOYPATH
    - /usr/bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} +
    - /usr/bin/find $DEPLOYPATH -name '*.php' -exec /usr/bin/touch {} +
    - /bin/rm -f $DEPLOYPATH/CLAUDE.md
