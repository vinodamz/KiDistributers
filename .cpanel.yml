---
# Placeholder cPanel recipe. Point the rsync destination at the Ki Distributers
# docroot once the subdomain exists. Same model as Little Graduates: PHP from
# source, no build step.
deployment:
  tasks:
    - /usr/bin/rsync -av --checksum --no-perms --omit-dir-times --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='README.md' --exclude='CICD.md' --exclude='CLAUDE.md' --exclude='install.php' --exclude='includes/config.php' ./ $HOME/kidistributers.example.com/ > $HOME/last-kd-deploy.log 2>&1
    - /bin/rm -rf $HOME/kidistributers.example.com/CLAUDE.md $HOME/kidistributers.example.com/install.php
    - /usr/bin/find $HOME/kidistributers.example.com -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find $HOME/kidistributers.example.com -type f -exec /bin/chmod 644 {} +
