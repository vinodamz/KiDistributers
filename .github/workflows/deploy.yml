name: Deploy to Hostgator (cPanel pull)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none

      - name: php -l on every .php file
        run: |
          set -e
          find . -path ./.git -prune -o -name '*.php' -print | while read -r f; do
            php -l "$f" >/dev/null
          done

  deploy:
    name: Trigger cPanel git-pull and deploy
    needs: lint
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      REPO_ROOT: /home/${{ secrets.CPANEL_USER }}/repos/KiDistributers
    steps:
      - name: Require cPanel secrets
        run: |
          set -e
          missing=0
          for name in CPANEL_HOST CPANEL_USER CPANEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions. See CICD.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Normalise host (strip URL wrapper, port, path, whitespace)
        run: |
          set -e
          HOST=$(printf '%s' "${CPANEL_HOST}" | tr -d '\r\n\t ' | sed -E 's#^https?://##; s#/.*$##; s#:208[37]$##')
          USER=$(printf '%s' "${CPANEL_USER}" | tr -d '\r\n\t ')
          TOKEN=$(printf '%s' "${CPANEL_TOKEN}" | tr -d '\r\n\t ')
          echo "::add-mask::${HOST}"
          echo "::add-mask::${USER}"
          echo "::add-mask::${TOKEN}"
          if [ -z "${HOST}" ] || ! [[ "${HOST}" =~ [.] ]]; then
            echo "::error::CPANEL_HOST must be the cPanel server hostname from the browser bar (e.g. s3744.bom1.stableserver.net), with no https:// and no :2083."
            exit 1
          fi
          if ! getent hosts "${HOST}" >/dev/null; then
            echo "::error::GitHub Actions cannot resolve CPANEL_HOST in DNS. Copy the hostname from the cPanel login URL (the part before :2083), not your website domain unless that name is the control-panel host."
            exit 1
          fi
          echo "Resolved CPANEL_HOST (${#HOST} chars)."
          echo "CPANEL_HOST_CLEAN=${HOST}" >> "$GITHUB_ENV"
          echo "CPANEL_USER=${USER}" >> "$GITHUB_ENV"
          echo "CPANEL_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "REPO_ROOT=/home/${USER}/repos/KiDistributers" >> "$GITHUB_ENV"

      - name: 1/2 — Pull latest from origin (git fetch + reset to remote)
        run: |
          set -e
          uapi() {
            local module="$1" func="$2"
            shift 2
            curl -sS --fail-with-body -X POST \
              "https://${CPANEL_HOST_CLEAN}:2083/execute/${module}/${func}" \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              "$@"
          }

          uapi VersionControl update \
            --data-urlencode "repository_root=${REPO_ROOT}" \
            --data-urlencode "branch=main" \
            | tee /tmp/pull.json
          jq -e '.status == 1' /tmp/pull.json > /dev/null || (cat /tmp/pull.json; exit 1)

          if [ "$(jq -r '.data.deployable // 0' /tmp/pull.json)" != "1" ]; then
            echo "::warning::deployable=0 after pull. Listing clone (hidden files too) and removing common junk, then pulling again."
            uapi Fileman list_files \
              --data-urlencode "dir=${REPO_ROOT}" \
              --data-urlencode "show_hidden=1" \
              | tee /tmp/clone-root.json || true
            jq -r '.data[]? | "\(.type // "file")\t\(.file // .fullpath // .name // .)"' /tmp/clone-root.json || true

            for junk in error_log .DS_Store last-deploy.log last-kd-deploy.log \
                        includes/error_log includes/.DS_Store; do
              uapi Fileman fileop \
                --data-urlencode "op=unlink" \
                --data-urlencode "sourcefiles=${REPO_ROOT}/${junk}" \
                >/tmp/unlink.json || true
            done

            uapi VersionControl update \
              --data-urlencode "repository_root=${REPO_ROOT}" \
              --data-urlencode "branch=main" \
              | tee /tmp/pull.json
            jq -e '.status == 1' /tmp/pull.json > /dev/null || (cat /tmp/pull.json; exit 1)
          fi

          echo "deployable=$(jq -r '.data.deployable' /tmp/pull.json) last=$(jq -r '.data.last_update.identifier' /tmp/pull.json)"
          if [ "$(jq -r '.data.deployable // 0' /tmp/pull.json)" != "1" ]; then
            echo "::error::Clone is still not deployable. In cPanel Terminal run: cd ~/repos/KiDistributers && git status && git clean -fd && git checkout -- . && git pull"
            echo "::error::Or Git Version Control → Manage → discard local changes, then Deploy HEAD."
            exit 1
          fi

      - name: 2/2 — Run .cpanel.yml deployment task (rsync to docroot)
        run: |
          set -e
          curl -sS --fail-with-body -X POST \
            "https://${CPANEL_HOST_CLEAN}:2083/execute/VersionControlDeployment/create" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "repository_root=${REPO_ROOT}" \
            | tee /tmp/deploy.json
          jq -e '.status == 1' /tmp/deploy.json > /dev/null || (cat /tmp/deploy.json; exit 1)
          if [ "$(jq -r '.data.deploy_id // empty' /tmp/deploy.json)" = "" ]; then
            echo "::error::cPanel returned status 1 but no deploy_id — .cpanel.yml likely did not rsync. Check a dirty git clone (see previous step)."
            exit 1
          fi

      - name: 3/3 — Self-test (probe the live URL)
        run: |
          set +e
          if [ -z "${DEPLOY_URL}" ]; then
            echo "::notice::DEPLOY_URL secret is not set — skipping live probe. Add it (e.g. https://kd.example.com/login.php) once the subdomain is live."
            exit 0
          fi
          sleep 6
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "${DEPLOY_URL}?_=$(date +%s)")
          echo "GET ${DEPLOY_URL} → HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "::error::Live URL returned $STATUS — the deploy looks complete but the URL is dead."
            echo "::error::Check ~/last-kd-deploy.log on the server and verify file permissions (dirs 755, files 644)."
            exit 1
          fi
          BASE=$(printf '%s' "${DEPLOY_URL}" | sed -E 's#(https?://[^/]+).*#\1#')
          APPS="${BASE}/apps/index.php"
          AST=$(curl -sS -o /dev/null -w "%{http_code}" "${APPS}?_=$(date +%s)")
          echo "GET ${APPS} → HTTP $AST"
          if [ "$AST" = "404" ]; then
            echo "::error::/apps/index.php is 404 — rsync did not copy the super-app into the docroot. Deploy HEAD from cPanel after making the git clone clean."
            exit 1
          fi
          echo "::notice::Site is live."
